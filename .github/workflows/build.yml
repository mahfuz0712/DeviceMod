
name: DeviceMod CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Build debug APK
        run: gradle :android:assembleDebug --stacktrace

      - name: Copy APK to dist
        run: |
          mkdir -p dist
          APK_PATH="android/build/outputs/apk/debug"
          if [ ! -d "$APK_PATH" ]; then
            echo "APK output directory not found: $APK_PATH"
            find android -type f -name "*.apk"
            exit 1
          fi
          APK_FILE=$(find "$APK_PATH" -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK file found!"
            exit 1
          fi
          cp "$APK_FILE" dist/DeviceMod-android-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DeviceMod-Android-APK
          path: dist/DeviceMod-android-debug.apk
          if-no-files-found: error

  windows-build:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils

      - name: Verify build tools
        shell: msys2 {0}
        run: |
          make --version
          g++ --version
          gcc --version

      - name: Build Windows application
        shell: msys2 {0}
        run: |
          cd windows
          make clean
          make

      - name: Verify Windows executable
        shell: msys2 {0}
        run: |
          test -f windows/dist/DeviceMod.exe
          file windows/dist/DeviceMod.exe

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: DeviceMod-Windows
          path: windows/dist/DeviceMod.exe
          if-no-files-found: error

  bundle:
    name: Bundle build artifacts
    needs:
      - android
      - windows-build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Display artifact structure
        run: |
          find dist -type f -print

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeviceMod-dist
          path: dist/
          if-no-files-found: error
