name: DeviceMod CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle :android:assembleDebug --stacktrace
      - name: Copy APK to dist
        run: |
          mkdir -p dist
          cp android/build/outputs/apk/debug/*.apk dist/DeviceMod-android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DeviceMod-Android-APK
          path: dist/DeviceMod-android-debug.apk

  windows:
    name: Build Windows GUI (MSYS2 UCRT64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
      - name: Build DeviceMod.exe
        shell: msys2 {0}
        run: |
          cd windows
          make
      - uses: actions/upload-artifact@v4
        with:
          name: DeviceMod-Windows-UCRT64
          path: dist/DeviceMod.exe

  bundle:
    name: Bundle source and artifacts
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: DeviceMod-dist
          path: dist/*
